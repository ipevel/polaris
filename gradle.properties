# Project-wide Gradle settings.
# 注意:不要在此文件写机器特定路径(如 org.gradle.java.home)——
# 请通过环境变量 JAVA_HOME 或 PATH 提供 JDK 17/21(见 README「构建」章节)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存开启后 IDE 同步与命令行构建均正常;若 kernel-service 的 KSP
# 出现配置缓存序列化报错,先确认 AGP/KSP 版本再考虑关闭
org.gradle.configuration-cache=true

# Kotlin：在 Gradle 进程内运行编译器，避免 IDE 沙盒下 Kotlin daemon
# 写 ~/Library/Application Support/kotlin/daemon/ 通信文件被 macOS 拒绝
# （沙盒抛 Operation not permitted，触发 "phased action failed" 同步错误）
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
