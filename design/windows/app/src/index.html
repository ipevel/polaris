<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 严格 CSP：渲染层只加载本地资源，禁外联、禁插件、禁 form 提交 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Polaris</title>
<link rel="stylesheet" href="css/design.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/views-extra.css">
</head>
<body>
<div class="window" id="app">
  <div class="titlebar">
    <img class="app-icon" src="assets/p-icon.png" alt="">
    <div class="drag"></div>
    <div class="win-btns">
      <button class="win-btn" id="btn-min" title="最小化">—</button>
      <button class="win-btn" id="btn-max" title="最大化">▢</button>
      <button class="win-btn close" id="btn-close" title="关闭到托盘">✕</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="nav-item" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>首页</span></div>
      <div class="nav-item" data-route="nodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>节点</span></div>
      <div class="nav-item" data-route="traffic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8"/><path d="M11 20V6"/><path d="M17 20v-5"/><path d="M3 20h18"/></svg><span>流量</span></div>
      <div class="nav-item" data-route="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg><span>我的</span></div>
      <div class="nav-item" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.36.95A7 7 0 0 0 14.1 5.1L13.75 2.6h-3.5L9.9 5.1a7 7 0 0 0-2.4 1.44l-2.36-.95-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.36-.95a7 7 0 0 0 2.4 1.44l.35 2.5h3.5l.35-2.5a7 7 0 0 0 2.4-1.44l2.36.95 2-3.46-2-1.55c.1-.46.14-.93.14-1.4z"/></svg><span>设置</span></div>
      <div class="ver" id="side-ver"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
  <div id="overlay-root"></div>
</div>
<script src="js/format.js"></script>
<script src="js/md.js"></script>
<script src="js/api.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
