<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 严格 CSP：渲染层只加载本地资源，禁外联、禁插件、禁 form 提交 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Polaris</title>
<link rel="stylesheet" href="css/design.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/views-extra.css">
</head>
<body>
<div class="app-window" id="app">
  <div class="window-drag-region"></div>
  <div class="win-btns">
    <button class="win-btn" id="btn-min" title="最小化"><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M2 5.5h7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
    <button class="win-btn" id="btn-max" title="最大化"><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><rect x="2.2" y="2.2" width="6.6" height="6.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
    <button class="win-btn close" id="btn-close" title="关闭到托盘"><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M2.6 2.6l5.8 5.8M8.4 2.6l-5.8 5.8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg></button>
  </div>
  <div class="app-frame">
    <aside class="app-sidebar" id="sidebar">
      <nav class="sidebar-nav" aria-label="主导航">
        <section class="nav-section">
          <div class="nav-link nav-item" data-route="home" tabindex="0">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 13 2.5-7h5"/></svg></span><span>活动</span>
          </div>
          <div class="nav-link nav-item" data-route="nodes" tabindex="0">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="12" cy="18" r="2.6"/><path d="M8.2 6h7.6M7.4 8.3l3.4 7.4M16.6 8.3l-3.4 7.4"/></svg></span><span>策略</span>
          </div>
          <div class="nav-link nav-item" data-route="traffic" tabindex="0">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 20v-7"/><path d="M11 20V5"/><path d="M17 20v-4"/><path d="M3 20h18"/></svg></span><span>流量</span>
          </div>
        </section>
        <section class="nav-section">
          <h2 class="nav-section-title">代理</h2>
          <div class="nav-link nav-item" data-route="routing" tabindex="0">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h11l-3-3"/><path d="M16 18H5l3 3"/><path d="M19 6l-3 3"/><path d="M5 18l3-3"/></svg></span><span>分流规则</span>
          </div>
        </section>
        <section class="nav-section">
          <h2 class="nav-section-title">配置</h2>
          <div class="nav-link nav-item" data-route="settings" tabindex="0">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.36.95A7 7 0 0 0 14.1 5.1L13.75 2.6h-3.5L9.9 5.1a7 7 0 0 0-2.4 1.44l-2.36-.95-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.36-.95a7 7 0 0 0 2.4 1.44l.35 2.5h3.5l.35-2.5a7 7 0 0 0 2.4-1.44l2.36.95 2-3.46-2-1.55c.1-.46.14-.93.14-1.4z"/></svg></span><span>设置</span>
          </div>
        </section>
      </nav>
      <div class="sidebar-footer">
        <div class="nav-link nav-item" data-route="me" tabindex="0">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg></span><span>我的</span>
        </div>
        <div class="sidebar-version" id="side-ver"></div>
      </div>
    </aside>
    <main class="app-content" id="content"></main>
  </div>
  <div id="overlay-root"></div>
</div>
<script src="js/format.js"></script>
<script src="js/flags.js"></script>
<script src="js/md.js"></script>
<script src="js/api.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
