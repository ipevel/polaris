# Polaris Windows 端门禁（design/windows/app）
#
# 文件名为什么带 -windows：主仓库已经有一个 `.github/workflows/ci.yml`（纯安卓 + Go 的
# version-gate / go / quality 三个 job）。如果这个文件也叫 ci.yml，同步进 main 时会**整个
# 覆盖掉安卓那条**，安卓门禁当场消失。分开命名，两边互不干扰、各自独立触发。
#
# 为什么单独一条：主仓库的 `ci.yml` 是**纯安卓 + Go** 的（三个 job 全在 ubuntu 上），
# `design/windows/app` 的代码一行都没被扫过；而 `build.yml` 里虽然有个 windows job，
# 但它只在**手动发版**时跑，而且只验证「能打包」，没有任何测试或语法检查。
# 结果就是：Windows 端 41 个 js 文件、7 条自检，全靠人记得手动跑。
# 这个 workflow 就是补这一块：push / PR 都自动跑，只做**不需要凭据、不下载外网、
# 不碰真安装目录**的离线自检（真面板那两条见 README 的 `test:real` / `test:ui`）。
#
# 触发分支：main + windows-portable。
# 2026-10-15 起 Polaris 改为「单 main + 短命分支 + PR」：main 是唯一集成与发版源，
# windows-portable 只作过渡保留，因此这条门禁必须跟着 main 的 push / PR 一起跑，
# 否则 design/windows/app 的改动在 main 上无人扫（主 ci.yml 是纯安卓 + Go）。
# 不加 paths 过滤：一旦加了 paths，不碰 design/windows/** 的 PR 不会上报这条 check，
# 而它是要当 required status check 用的 —— required 的 check 不上报会把 PR 永久卡住。
# 这条 workflow 与主 ci.yml 是不同文件、不同 job 名，互不覆盖、互不打架。

name: Polaris Windows CI

on:
  push:
    branches: [main, windows-portable]
  pull_request:
    branches: [main, windows-portable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-offline:
    name: Windows 离线自检 + 语法检查
    # 为什么跑 windows-latest 而不是 ubuntu（更贵、更慢，是权衡后的选择）：
    #   1. 这个产品只有 Windows 版。updater 的 extract() 就是 Windows 实现
    #      （`tar -xf` 走 Windows 自带 bsdtar，失败再回退 `powershell Expand-Archive`）。
    #      在 ubuntu 上跑到解压那一步必然 `spawn powershell ENOENT` —— 第一次提交
    #      就是 ubuntu，离线自检当场 19/4 红（用例 5、6 全挂）。那不是产品 bug，
    #      是拿错平台的运行时去验一个 Windows-only 的模块。
    #   2. 顺带把 Windows 专有假设（路径分隔符、bsdtar、PowerShell 回退）也纳入验证，
    #      这些在 ubuntu 上永远验不到。
    # 代价：Windows runner 计费更高。所以只跑离线自检，不装 Electron、不打包。
    runs-on: windows-latest
    # 离线自检里 updater-self-test 有一段故意等满 120 秒（验「父进程不退」），
    # 加上 npm ci 与 Windows runner 的启动开销，给足余量。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: design/windows/app

    steps:
      - name: 检出代码（当前分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ------------------------------------------------------------------
      # 一次 checkout 同时解决两个「CI 上永远绿」的隐患：
      #
      # 1. routing-sync：这条自检要拿 main 的
      #    kernel-core/src/main/golang/native/config/routing/routing_table.go
      #    跟 Windows 的 electron/core/rulesets.js 逐条比对；而 windows-portable
      #    分支只有 design/，没有 kernel-core/ —— 本地跑会打印「跳过」并 exit 0。
      #    跳过在 CI 里就等于一个永远绿的假通过，所以**不能**这么放过。
      #    理由：main 是分流表的事实来源，windows-portable 是镜像；要防的正是
      #    「main 改了表、Windows 镜像没跟上」。
      # 2. flags：flag-codes-test 里有一段「与安卓端 257 张图名集合比对」，
      #    安卓仓库不在本仓库里，不 checkout 就永远打印 skip。
      #
      # 成本很低：只取两个目录，不装 Go、不编译。
      # ------------------------------------------------------------------
      - name: 取 main 的 kernel-core + 安卓 flags（两条自检要用它真跑）
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-main
          sparse-checkout: |
            kernel-core
            app/src/main/assets/flags
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      # 离线自检本身只用 Node 内置模块，不需要依赖；但 `node --check` 要能解析
      # 每条 require，缺了 node_modules 会误报，所以照常装。
      - name: 安装依赖
        run: npm ci

      # 13 条离线自检：不需要 Electron、不需要网络、不碰真安装目录。
      # 用链式命令而不是 13 个 step，是为了失败时一眼看出是哪条断的，
      # 同时保证「前一条挂了后面的不会假装通过」。
      #
      # 两条 REQUIRED 环境变量把「跳过」堵死：
#   POLARIS_GO_TABLE_REQUIRED=1     → 找不到 Go 表就红，不是绿（新口径优先 in-tree，见下）
      #   POLARIS_ANDROID_REQUIRED=1      → 找不到安卓 flags 目录就红，不是绿
      # Go 表的取数口径（2026-10-15 收紧）：**优先当前检出的 kernel-core**，取不到才回退 .ci-main。
      # 原来硬指向 .ci-main（ref: main），于是「PR 改了 Go 表、JS 镜像没跟上」反而绿 ——
      # 门禁要等 main push 之后才红，抓不住漂移本身。改成优先 in-tree 后，PR 路径读到的就是 PR
      # 自己的 Go 表，两端必须在同一个 PR 里一致（与安卓侧 RoutingTableParityTest 的行为对齐）。
      # 回退分支只为过渡期的 windows-portable（它只有 design/，没有 kernel-core/）保留。
      - name: 离线自检 13 条（updater / updater-timeout / traffic / geosync / rulesync / routing-sync / flags / flag-row / dns / portowner / config / single-source / routing-view）
        shell: bash
        env:
          POLARIS_GO_TABLE_REQUIRED: '1'
          POLARIS_ANDROID_DIR: ${{ github.workspace }}/.ci-main
          POLARIS_ANDROID_REQUIRED: '1'
        run: |
          set -euo pipefail
          go_table="${{ github.workspace }}/kernel-core/src/main/golang/native/config/routing/routing_table.go"
          if [ ! -f "$go_table" ]; then
            go_table="${{ github.workspace }}/.ci-main/kernel-core/src/main/golang/native/config/routing/routing_table.go"
            echo "::notice::当前检出没有 kernel-core（过渡期分支），回退用 .ci-main 的 Go 表：$go_table"
          fi
          echo "[routing-sync] 用 Go 表：$go_table"
          POLARIS_GO_TABLE="$go_table" npm run test:offline

      # 便宜的兜底：语法错误在这里就红，不用等打包才发现。
      - name: 语法检查（所有 js）
        shell: bash
        run: |
          set -euo pipefail
          # --check 只解析不执行，所以不依赖 Electron 运行时；
          # 但 preload.js / tray.js 等文件里 require('electron') 不会被执行，安全。
          mapfile -t files < <(git ls-files '*.js' | grep -v '^design/windows/app/node_modules/')
          echo "待检查 ${#files[@]} 个文件"
          for f in "${files[@]}"; do
            node --check "$f" || { echo "::error::语法错误：$f"; exit 1; }
          done
          echo "全部通过"

      # 上面两条 REQUIRED 是真跑的前提：checkout 成功不代表 sparse-checkout
      # 真取到了文件，所以显式确认一次，取不到就红。
      - name: 确认跨仓库输入真的取到了
        shell: bash
        run: |
          set -euo pipefail
          go="${{ github.workspace }}/.ci-main/kernel-core/src/main/golang/native/config/routing/routing_table.go"
          flags="${{ github.workspace }}/.ci-main/app/src/main/assets/flags"
          if [ ! -f "$go" ]; then
            echo "::error::没取到 main 的 routing_table.go：$go"
            echo "::error::请检查上面的 sparse-checkout 是否还匹配得上 main 的目录结构。"
            exit 1
          fi
          n=$(find "$flags" -maxdepth 1 -name '*.svg' | wc -l)
          if [ "$n" -lt 100 ]; then
            echo "::error::安卓 flags 只取到 $n 张（预期 257）：$flags"
            exit 1
          fi
          echo "routing_table.go 与 $n 张安卓 flags 都在"
