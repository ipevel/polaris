# Polaris Windows 端门禁（design/windows/app）
#
# 文件名为什么带 -windows：主仓库已经有一个 `.github/workflows/ci.yml`（纯安卓 + Go 的
# version-gate / go / quality 三个 job）。如果这个文件也叫 ci.yml，同步进 main 时会**整个
# 覆盖掉安卓那条**，安卓门禁当场消失。分开命名，两边互不干扰、各自独立触发。
#
# 为什么单独一条：主仓库的 `ci.yml` 是**纯安卓 + Go** 的（三个 job 全在 ubuntu 上），
# `design/windows/app` 的代码一行都没被扫过；而 `build.yml` 里虽然有个 windows job，
# 但它只在**手动发版**时跑，而且只验证「能打包」，没有任何测试或语法检查。
# 结果就是：Windows 端 41 个 js 文件、7 条自检，全靠人记得手动跑。
# 这个 workflow 就是补这一块：push / PR 都自动跑，只做**不需要凭据、不下载外网、
# 不碰真安装目录**的离线自检（真面板那两条见 README 的 `test:real` / `test:ui`）。
#
# 触发分支：main + windows-portable。
# 2026-10-15 起 Polaris 改为「单 main + 短命分支 + PR」：main 是唯一集成与发版源，
# windows-portable 只作过渡保留，因此这条门禁必须跟着 main 的 push / PR 一起跑，
# 否则 design/windows/app 的改动在 main 上无人扫（主 ci.yml 是纯安卓 + Go）。
# issue #42：改成「变更判定 + always-report 聚合」——重活 windows-offline-run 只在 design/windows/** 变动时跑，
# 但同名 check（Windows 离线自检 + 语法检查）由聚合 job **永远上报**（跳过时绿），所以不会出现
# 「check 不上报把 PR 卡住」的问题。当前它**不在** branch protection 的 required 名单（名单只有主 ci.yml 的三条），
# 本 workflow 与主 ci.yml 是不同文件、不同 job 名，互不覆盖、互不打架。

name: Polaris Windows CI

on:
  push:
    branches: [main, windows-portable]
  pull_request:
    branches: [main, windows-portable]
  # issue #42 的排练缝（与 ci.yml 同口径）：这两个输入**只在 workflow_dispatch 生效**；
  # push/PR 路径一律按 auto 判定。scopes_override=auto 缺省；force_changes_failure 是 test-only 插桩。
  workflow_dispatch:
    inputs:
      scopes_override:
        description: '仅排练用：强制范围（auto=正常判定；all/win=跑；android=跳过 Windows 自检）'
        type: choice
        options: [auto, all, win, android]
        default: auto
      force_changes_failure:
        description: 'test-only：故意让变更判定失败，验证「判定失败 → Windows 自检仍跑」'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: win-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # issue #42：秒级「变更判定」（本 workflow 只看 Windows 范围）。异常/未匹配 → 全跑（fail-closed）。
  changes:
    name: 变更判定（Windows 路径分流）
    runs-on: ubuntu-latest
    outputs:
      win: ${{ steps.scope.outputs.win }}
      all: ${{ steps.scope.outputs.all }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 判定改动范围（异常/未匹配 → 全跑）
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_SCOPE: ${{ inputs.scopes_override }}
          FORCE_FAIL: ${{ inputs.force_changes_failure }}
        run: |
          set -uo pipefail
          { echo "all=true"; echo "win=true"; } >> "$GITHUB_OUTPUT"
          ALL=true; WIN=true
          finish() { { echo "all=$ALL"; echo "win=$WIN"; } >> "$GITHUB_OUTPUT"; echo "判定结果：all=$ALL win=$WIN"; }
          alltrue() { ALL=true; WIN=true; finish; exit 0; }
          fallback() { echo "::warning::$1（按 fail-closed 全跑）"; alltrue; }
          if [ "${FORCE_FAIL:-false}" = "true" ]; then
            echo "::warning::test-only：force_changes_failure=true，故意让变更判定失败（Windows 自检因 always() 仍会跑）"
            finish
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${DISPATCH_SCOPE:-auto}" in
              all|win) echo "::notice::排练：强制跑 Windows 自检"; alltrue ;;
              android) ALL=false; WIN=false; finish; exit 0 ;;
              *) fallback "workflow_dispatch 且 scopes_override=auto：没有可比对的 base" ;;
            esac
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then alltrue; fi
          if [ -z "${BASE_SHA:-}" ]; then fallback "PR 事件没拿到 base.sha"; fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || fallback "取 base 提交失败：$BASE_SHA"
          FILES=$(git diff --name-only "${BASE_SHA}...HEAD" 2>/dev/null) || fallback "git diff 失败：${BASE_SHA}...HEAD"
          if [ -z "$FILES" ]; then fallback "改动文件列表为空（判定不出范围）"; fi
          echo "改动文件（$(printf '%s\n' "$FILES" | wc -l) 个，最多显示 30 行）："
          printf '%s\n' "$FILES" | head -30
          WIN=false; UNKNOWN=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              design/windows/*) WIN=true ;;
              *) UNKNOWN=true ;;
            esac
          done <<RWEOF
          $FILES
          RWEOF
          if [ "$UNKNOWN" = "true" ] || [ "$WIN" = "false" ]; then
            ALL=true; WIN=true
            echo "::notice::有未匹配/基础设施路径或没有 Windows 改动 → 全跑（fail-closed）"
          else
            ALL=false
          fi
          finish

      - name: needs 与重活 对账（漏一个重活就红）
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const raw = fs.readFileSync('.github/workflows/ci-windows.yml', 'utf8');
          const src = raw.slice(raw.indexOf('\njobs:') + 1);   // 只在 jobs: 段里扫
          const jobKeys = [...src.matchAll(/^  ([A-Za-z0-9_-]+):\s*$/gm)].map((m) => m[1]);
          const blockOf = (key) => {
            const i = src.indexOf('\n  ' + key + ':\n');
            if (i < 0) return '';
            const rest = src.slice(i + 1);
            const nxt = rest.slice(4).search(/^  [A-Za-z0-9_-]+:\s*$/m);
            return nxt < 0 ? rest : rest.slice(0, nxt + 4);
          };
          const needsOf = (key) => {
            const m = /^    needs:\s*\[([^\]]*)\]/m.exec(blockOf(key));
            return m ? m[1].split(',').map((s) => s.trim()).filter(Boolean) : [];
          };
          const problems = [];
          const REQUIRED_NAME = 'Windows 离线自检 + 语法检查';
          if (!blockOf('windows-offline').split('\n').some((l) => l.trim() === 'name: ' + REQUIRED_NAME)) problems.push('聚合 job windows-offline 的 name 不是逐字「' + REQUIRED_NAME + '」');
          const needs = needsOf('windows-offline');
          if (!needs.includes('changes')) problems.push('windows-offline 的 needs 缺 changes：' + JSON.stringify(needs));
          if (!needs.includes('windows-offline-run')) problems.push('windows-offline 的 needs 缺 windows-offline-run：' + JSON.stringify(needs));
          const heavyAll = jobKeys.filter((k) => k !== 'changes' && k !== 'windows-offline');
          const covered = new Set(needs);
          const missing = heavyAll.filter((k) => !covered.has(k));
          if (missing.length) problems.push('有重活没被聚合 needs 覆盖：' + missing.join(', '));
          if (problems.length) { for (const p of problems) console.error('::error::' + p); process.exit(1); }
          console.log('对账通过：重活 ' + JSON.stringify(heavyAll) + ' 都被聚合 needs 覆盖；check 名字逐字存在');
          JS
  windows-offline-run:
    name: Windows 离线自检 + 语法检查 · 执行体
    needs: [changes]
    if: ${{ always() && (needs.changes.outputs.win == 'true' || needs.changes.outputs.all == 'true') }}
    # 为什么跑 windows-latest 而不是 ubuntu（更贵、更慢，是权衡后的选择）：
    #   1. 这个产品只有 Windows 版。updater 的 extract() 就是 Windows 实现
    #      （`tar -xf` 走 Windows 自带 bsdtar，失败再回退 `powershell Expand-Archive`）。
    #      在 ubuntu 上跑到解压那一步必然 `spawn powershell ENOENT` —— 第一次提交
    #      就是 ubuntu，离线自检当场 19/4 红（用例 5、6 全挂）。那不是产品 bug，
    #      是拿错平台的运行时去验一个 Windows-only 的模块。
    #   2. 顺带把 Windows 专有假设（路径分隔符、bsdtar、PowerShell 回退）也纳入验证，
    #      这些在 ubuntu 上永远验不到。
    # 代价：Windows runner 计费更高。所以只跑离线自检，不装 Electron、不打包。
    runs-on: windows-latest
    # 离线自检里 updater-self-test 有一段故意等满 120 秒（验「父进程不退」），
    # 加上 npm ci 与 Windows runner 的启动开销，给足余量。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: design/windows/app

    steps:
      - name: 检出代码（当前分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ------------------------------------------------------------------
      # 一次 checkout 同时解决两个「CI 上永远绿」的隐患：
      #
      # 1. routing-sync：这条自检要拿 main 的
      #    kernel-core/src/main/golang/native/config/routing/routing_table.go
      #    跟 Windows 的 electron/core/rulesets.js 逐条比对；而 windows-portable
      #    分支只有 design/，没有 kernel-core/ —— 本地跑会打印「跳过」并 exit 0。
      #    跳过在 CI 里就等于一个永远绿的假通过，所以**不能**这么放过。
      #    理由：main 是分流表的事实来源，windows-portable 是镜像；要防的正是
      #    「main 改了表、Windows 镜像没跟上」。
      # 2. flags：flag-codes-test 里有一段「与安卓端 257 张图名集合比对」，
      #    安卓仓库不在本仓库里，不 checkout 就永远打印 skip。
      #
      # 成本很低：只取两个目录，不装 Go、不编译。
      # ------------------------------------------------------------------
      - name: 取 main 的 kernel-core + 安卓 flags（两条自检要用它真跑）
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-main
          sparse-checkout: |
            kernel-core
            app/src/main/assets/flags
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      # 离线自检本身只用 Node 内置模块，不需要依赖；但 `node --check` 要能解析
      # 每条 require，缺了 node_modules 会误报，所以照常装。
      - name: 安装依赖
        run: npm ci

      # 13 条离线自检：不需要 Electron、不需要网络、不碰真安装目录。
      # 用链式命令而不是 13 个 step，是为了失败时一眼看出是哪条断的，
      # 同时保证「前一条挂了后面的不会假装通过」。
      #
      # 两条 REQUIRED 环境变量把「跳过」堵死：
#   POLARIS_GO_TABLE_REQUIRED=1     → 找不到 Go 表就红，不是绿（新口径优先 in-tree，见下）
      #   POLARIS_ANDROID_REQUIRED=1      → 找不到安卓 flags 目录就红，不是绿
      # Go 表的取数口径（2026-10-15 收紧）：**优先当前检出的 kernel-core**，取不到才回退 .ci-main。
      # 原来硬指向 .ci-main（ref: main），于是「PR 改了 Go 表、JS 镜像没跟上」反而绿 ——
      # 门禁要等 main push 之后才红，抓不住漂移本身。改成优先 in-tree 后，PR 路径读到的就是 PR
      # 自己的 Go 表，两端必须在同一个 PR 里一致（与安卓侧 RoutingTableParityTest 的行为对齐）。
      # 回退分支只为过渡期的 windows-portable（它只有 design/，没有 kernel-core/）保留。
      - name: 离线自检 13 条（updater / updater-timeout / traffic / geosync / rulesync / routing-sync / flags / flag-row / dns / portowner / config / single-source / routing-view）
        shell: bash
        env:
          POLARIS_GO_TABLE_REQUIRED: '1'
          POLARIS_ANDROID_DIR: ${{ github.workspace }}/.ci-main
          POLARIS_ANDROID_REQUIRED: '1'
        run: |
          set -euo pipefail
          go_table="${{ github.workspace }}/kernel-core/src/main/golang/native/config/routing/routing_table.go"
          if [ ! -f "$go_table" ]; then
            go_table="${{ github.workspace }}/.ci-main/kernel-core/src/main/golang/native/config/routing/routing_table.go"
            echo "::notice::当前检出没有 kernel-core（过渡期分支），回退用 .ci-main 的 Go 表：$go_table"
          fi
          echo "[routing-sync] 用 Go 表：$go_table"
          POLARIS_GO_TABLE="$go_table" npm run test:offline

      # 便宜的兜底：语法错误在这里就红，不用等打包才发现。
      - name: 语法检查（所有 js）
        shell: bash
        run: |
          set -euo pipefail
          # --check 只解析不执行，所以不依赖 Electron 运行时；
          # 但 preload.js / tray.js 等文件里 require('electron') 不会被执行，安全。
          mapfile -t files < <(git ls-files '*.js' | grep -v '^design/windows/app/node_modules/')
          echo "待检查 ${#files[@]} 个文件"
          for f in "${files[@]}"; do
            node --check "$f" || { echo "::error::语法错误：$f"; exit 1; }
          done
          echo "全部通过"

      # 上面两条 REQUIRED 是真跑的前提：checkout 成功不代表 sparse-checkout
      # 真取到了文件，所以显式确认一次，取不到就红。
      - name: 确认跨仓库输入真的取到了
        shell: bash
        run: |
          set -euo pipefail
          go="${{ github.workspace }}/.ci-main/kernel-core/src/main/golang/native/config/routing/routing_table.go"
          flags="${{ github.workspace }}/.ci-main/app/src/main/assets/flags"
          if [ ! -f "$go" ]; then
            echo "::error::没取到 main 的 routing_table.go：$go"
            echo "::error::请检查上面的 sparse-checkout 是否还匹配得上 main 的目录结构。"
            exit 1
          fi
          n=$(find "$flags" -maxdepth 1 -name '*.svg' | wc -l)
          if [ "$n" -lt 100 ]; then
            echo "::error::安卓 flags 只取到 $n 张（预期 257）：$flags"
            exit 1
          fi
          echo "routing_table.go 与 $n 张安卓 flags 都在"
  # issue #42：聚合 job —— 沿用原 check 名字（逐字），if: always()；唯一绿条件 = needs 全 success/skipped。
  windows-offline:
    name: Windows 离线自检 + 语法检查
    needs: [changes, windows-offline-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 聚合判定（唯一绿条件）
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ.get('NEEDS_JSON') or '{}')
          bad = {k: v.get('result') for k, v in needs.items() if v.get('result') not in ('success', 'skipped')}
          if bad:
              print('::error::上游未通过（failure/cancelled 一律红）：' + json.dumps(bad, ensure_ascii=False))
              sys.exit(1)
          print('聚合绿：' + json.dumps({k: v.get('result') for k, v in needs.items()}, ensure_ascii=False))
          PY
