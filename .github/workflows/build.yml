name: Polaris Build

# 打包并（可选）发布到 GitHub Releases。
#
# 用法：Actions → Polaris Build → Run workflow，填参数后运行。
#   - 只能从 main 分支或 v* 标签触发；其它 ref 会被 release-precheck 直接拒绝。
#   - 发版前置门禁（release-precheck，fail-closed）：本 commit 上
#       「版本门禁自测 / 内核 Go 门禁（vet + build + test）/ 质量门禁（test + ktlint + lint）」
#     三条 required check 与「Windows 离线自检 + 语法检查」必须全部 conclusion=success；
#     Checks API 读不到、名字对不上、或结论不是 success 一律判不通过 —— 不允许「读不到就放行」。
#     这三条 required 的名字必须与 main 分支保护里的 contexts 逐字一致（改名即读不到）。
#   - 门禁通过后由流水线自己创建 tag（v<versionName>，指向本次构建的 commit）：
#     tag 不存在则创建；已存在且指向同一 commit 则幂等继续；指向别的 commit 直接失败。
#     人工不再需要先打 tag；本流水线不 force、不移动、不删除任何已有 tag。
#   - 排练：dryRun=true 时只跑到「前置门禁 + 编译」，不打 tag、不上传产物、不建 Release。
#     ⚠️ workflow_dispatch 只能触发默认分支（main）上的 workflow，所以排练只能在
#     本文件合并进 main 之后手动跑一次；合并前的检查都是静态的。
#   - buildType=release 需要仓库 Secrets 四件套（全部 POLARIS_ 前缀）：
#       POLARIS_RELEASE_STORE_B64 / POLARIS_RELEASE_STORE_PASSWORD
#       POLARIS_RELEASE_KEY_ALIAS / POLARIS_RELEASE_KEY_PASSWORD
#     这些 Secret 原为 fork 残留的 SLTE_ 前缀，已统一改名。迁移顺序：先在
#     Settings → Secrets and variables → Actions 建好全部 POLARIS_*，用它成功
#     发一次版（核对 SIGNING.txt 指纹与旧版一致），再删除旧的 SLTE_*。
#     ⚠️ 两者不可长期并存半改名状态：本文件任一步骤取不到值，release 构建即失败。
#   - publishRelease=true 时，构建成功后自动创建/更新 Release 并附上 APK、
#     SHA256SUMS.txt 与签名证书指纹（SIGNING.txt）。
#   - 重复运行同一标签（releaseTag 相同）会更新既有 Release 的资产与说明，不会失败。
#   - versionName 必须填本次发布的版本号，且严格大于上一已发布版本：构建前会跑
#     .scripts/version_gate.py 校验版本号/versionCode/tag 三者自洽，并检查区间内的
#     feat / 破坏性变更是否递增了对应位（规则见 .scripts/version_gate.py 的文档字符串）。
#     发版固定 strict：不再提供 warn/off 降级开关（紧急回滚请走 revert + 新的补丁版本）。
#   - 本 workflow 不再重复跑单元测试 / ktlint / Android Lint / R8 存活校验：这些已在
#     ci.yml 的质量门禁里跑过，而 release-precheck 要求那次结果必须是 success。

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 应用名称（桌面显示名）
        required: true
        default: Polaris
      applicationId:
        description: 包名
        required: true
        default: com.polaris.app
      versionName:
        description: 版本号（X.Y.Z，必须严格大于上一已发布版本；门禁会校验）
        required: true
        default: ''
      versionCode:
        description: versionCode（留空自动生成）
        required: false
        default: ''
      apiBaseUrl:
        description: 面板 API 地址
        required: true
      apiType:
        description: 编译期后端占位值（遗留字段；运行时登录会自动识别后端类型，此处不影响 App 行为）
        type: choice
        options:
          - xiaov2b
          - xboard
        default: xiaov2b
      remoteConfigUrls:
        description: 远程动态地址（逗号分隔，最多 3 个）
        required: false
        default: ''
      allowedDomains:
        description: 追加白名单域名（逗号分隔）
        required: false
        default: ''
      notificationTitle:
        description: 通知栏标题（留空跟随应用名）
        required: false
        default: ''
      notificationTraffic:
        description: 通知栏流量显示
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      telegramGroupUrl:
        description: Telegram 讨论组链接（留空则个人页不显示该入口）
        required: false
        default: ''
      buildType:
        description: 构建类型（release 需仓库 Secrets 签名四件套）
        type: choice
        options:
          - debug
          - release
        default: release
      publishRelease:
        description: 是否创建 GitHub Release（仅 buildType=release 时生效）
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      releaseTag:
        description: Release 标签名（留空自动使用 v<版本号>）
        required: false
        default: ''
      dryRun:
        description: |
          排练模式：true 时只跑到「前置门禁 + 编译」，不打 tag、不上传产物、不建 Release。
          ⚠️ workflow_dispatch 只能触发默认分支（main）上的 workflow，所以排练只能在
          本文件合并进 main 之后手动跑一次；合并前的检查都是静态的。
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      releaseNotes:
        description: |
          Release 变更说明（留空则不输出「变更说明」小节；填 auto 会写成「见 git log」）。
          变更说明写用户可感知的结果即可（如「修复若干已知问题」），不必罗列实现细节；
          commit 标题保持同一尺度。
        required: false
        default: ''
      iconB64:
        description: 自定义启动图标（PNG 的 base64，≤36KB；留空使用仓库默认图标）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # 发布构建按分支串行：同分支重复触发时排队等待，不打断进行中的发布（避免产生半成品 Release）
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发版前置门禁（fail-closed）：读不到、名字对不上、或结论不是 success 一律判不通过。
  # 放行一次就等于把没验过的提交当成「已发布版本」发出去，所以这里不设任何降级开关。
  release-precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 读 check-runs API 需要 checks: read；显式声明，避免仓库默认权限收紧后静默变成 403。
      checks: read
    steps:
      - name: 校验触发 ref（只允许 main 或 v* 标签）
        env:
          REF: ${{ github.ref }}
        run: |
          set -e
          case "$REF" in
            refs/heads/main|refs/tags/v*)
              echo "触发 ref 合法：$REF" ;;
            *)
              echo "::error::发版只能从 refs/heads/main 或 refs/tags/v* 触发，当前为 $REF"
              exit 1 ;;
          esac

      - name: 校验本次构建提交的质量门禁（三条 required + Windows 离线自检，fail-closed）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/check_runs_gate.py" <<'PRECHECK_PY'
          import json, os, sys, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          SHA = os.environ["SHA"]

          # 三条 required 的字符串与 main 分支保护 required_status_checks.contexts 逐字一致
          # （2026-10-15 用 GET /repos/ipevel/polaris/branches/main/protection 读回核对）。
          # 改名即读不到 —— 读不到一律 fail-closed。
          REQUIRED = [
              "版本门禁自测",
              "内核 Go 门禁（vet + build + test）",
              "质量门禁（test + ktlint + lint）",
          ]
          WINDOWS = "Windows 离线自检 + 语法检查"

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "polaris-release-precheck",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          runs = []
          page = 1
          while True:
              url = "https://api.github.com/repos/%s/commits/%s/check-runs?per_page=100&page=%d" % (REPO, SHA, page)
              try:
                  payload = fetch(url)
              except Exception as exc:
                  print("::error::读取 check-runs 失败（fail-closed，不放行）：%s" % exc)
                  sys.exit(1)
              batch = payload.get("check_runs") or []
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 10:
                  print("::error::check-runs 分页超过 10 页，拒绝继续（fail-closed）")
                  sys.exit(1)

          # 同名 check 可能重跑过多次：只认 id 最大（最新一次），避免拿旧绿灯放行。
          latest = {}
          for run in runs:
              name = run.get("name")
              if name is None:
                  continue
              cur = latest.get(name)
              if cur is None or int(run.get("id") or 0) > int(cur.get("id") or 0):
                  latest[name] = run

          print("本次构建提交 %s 上的 check（每个名字取最新一次）：" % SHA)
          for name in sorted(latest):
              run = latest[name]
              print("  - %s: status=%s conclusion=%s head_sha=%s" % (name, run.get("status"), run.get("conclusion"), run.get("head_sha")))

          problems = []
          for name in REQUIRED + [WINDOWS]:
              run = latest.get(name)
              if run is None:
                  problems.append("%s：该提交上找不到这个 check" % name)
                  continue
              if run.get("head_sha") != SHA:
                  problems.append("%s：head_sha=%s 与本次构建提交不一致" % (name, run.get("head_sha")))
              if run.get("status") != "completed":
                  problems.append("%s：status=%s（还没跑完）" % (name, run.get("status")))
                  continue
              if run.get("conclusion") != "success":
                  problems.append("%s：conclusion=%s" % (name, run.get("conclusion")))

          if problems:
              for item in problems:
                  print("::error::发版前置门禁不通过 —— %s" % item)
              sys.exit(1)
          print("::notice::发版前置门禁通过：%d 条 check 全部 success" % (len(REQUIRED) + 1))
          PRECHECK_PY
          python3 "$RUNNER_TEMP/check_runs_gate.py"

      - name: 校验 tag 指向（已存在时必须指向本次构建提交）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.versionName }}
          TAG_INPUT: ${{ inputs.releaseTag }}
        run: |
          set -e
          if [ -z "$VERSION_INPUT" ]; then
            echo "::error::versionName 为空，请填写本次发布的版本号（形如 1.5.18）"
            exit 1
          fi
          TAG="${TAG_INPUT:-v${VERSION_INPUT}}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::拒绝使用非 v* 标签：$TAG"; exit 1 ;;
          esac
          OUT="$(gh api "repos/$REPO/commits/$TAG" --jq .sha 2>&1)" && STATUS=0 || STATUS=$?
          # 这个端点对「ref 不存在」返回 422（body: No commit found for SHA: <ref>），
          # 只有别的失败路径才回 404：两种都当「尚不存在」，其余一律 fail-closed。
          # 422 必须同时带 No commit found 才算不存在（措辞/误匹配时不静默放宽）。
          # 2026-10-15 实测：/commits/v1.12.0 -> 422；/git/ref/tags/v1.12.0 -> 404。
          if [ "$STATUS" = "0" ]; then
            if [ "$OUT" != "$SHA" ]; then
              echo "::error::tag $TAG 已存在且指向 $OUT，本次构建的是 $SHA；请核对 versionName / releaseTag"
              exit 1
            fi
            echo "::notice::tag $TAG 已存在且指向本次构建提交，幂等继续"
          elif printf '%s' "$OUT" | grep -q 'HTTP 404' \
            || { printf '%s' "$OUT" | grep -q 'HTTP 422' && printf '%s' "$OUT" | grep -q 'No commit found'; }; then
            echo "::notice::tag $TAG 尚不存在，将由 release-tag job 创建（指向 $SHA）"
          else
            echo "::error::读取 tag $TAG 失败（fail-closed，不放行）：$OUT"
            exit 1
          fi

      - name: 校验 config/remote.json 的遗留更新字段为空（fail-closed）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          # 历史版本 App 与 Windows 端的镜像来源都会读 config/remote.json 的 update_* 字段；
          # 字段非空会让客户端提示一个早已下架（甚至下载不到包）的旧版本。
          # 发版流程不再回写该文件：分支保护下直推 main 会被拒，而该步骤在 Release 建出之后执行，
          # 失败会留下「Release 已发布、remote.json 未更新」的半成品。改为只读校验、fail-closed：
          # 读不到文件或字段非空一律不放行，人工用 PR 置空后重跑发版。
          OUT="$(gh api "repos/$REPO/contents/config/remote.json?ref=$SHA" --jq .content 2>&1)" || {
            echo "::error::读取 config/remote.json 失败（fail-closed，不放行）：$OUT"; exit 1; }
          printf '%s' "$OUT" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/remote.json" || {
            echo "::error::config/remote.json base64 解码失败（fail-closed，不放行）"; exit 1; }
          python3 - "$RUNNER_TEMP/remote.json" <<'PY'
          import json, sys
          cfg = json.load(open(sys.argv[1], encoding="utf-8"))
          bad = []
          if str(cfg.get("update_version", "") or "").strip():
              bad.append("update_version=%r" % cfg.get("update_version"))
          if str(cfg.get("update_apk_url", "") or "").strip():
              bad.append("update_apk_url=%r" % cfg.get("update_apk_url"))
          if str(cfg.get("update_apk_sha256", "") or "").strip():
              bad.append("update_apk_sha256=%r" % cfg.get("update_apk_sha256"))
          if cfg.get("update_force") is True:
              bad.append("update_force=true")
          if bad:
              print("::error::config/remote.json 的遗留更新字段非空：%s" % "; ".join(bad))
              print("::error::这会让仍在读该文件的客户端提示旧版本；请用 PR 置空后重跑发版")
              sys.exit(1)
          print("::notice::config/remote.json 遗留更新字段均为空，校验通过")
          PY
  # 版本解析与门禁是所有产物的共同前置：安卓 APK 与 Windows 便携版必须用同一个
  # versionName / versionCode / tag，而且都必须先过同一道门禁。抽成独立 job 输出，
  # 下游用 needs 取用——否则同一段逻辑要在两个 runner 上各写一份，日后必然走偏。
  version:
    needs: release-precheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versionName: ${{ steps.version.outputs.versionName }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 版本门禁要读历史 tag 与上一版构建文件。本仓库 .git 约 290MB，
          # 不做全量克隆：先只取当前提交与 tag 引用，再按需加深（见下一步）。
          fetch-depth: 1
          fetch-tags: true

      - name: 补全版本门禁所需的历史
        run: |
          set -e
          # 门禁要跑 git log <上一版 tag>..HEAD 判定提交类型，depth=1 取不到区间提交。
          # 加深到 500 个提交即可覆盖全部 tag（当前仓库约 220 个提交），失败则退回全量。
          git fetch --no-tags --deepen=500 origin "$(git rev-parse --abbrev-ref HEAD)" \
            || git fetch --no-tags --unshallow
          echo "可见 tag 数：$(git tag --list 'v*' | wc -l)"

      - name: 解析发布版本号
        id: version
        env:
          VERSION_INPUT: ${{ inputs.versionName }}
          CODE_INPUT: ${{ inputs.versionCode }}
          TAG_INPUT: ${{ inputs.releaseTag }}
        run: |
          set -e
          # versionName / versionCode / tag 的单一来源：安卓构建、Windows 打包、发布
          # 都从这里取，避免「构建用 A、发布挂 B」的分叉。
          if [ -z "$VERSION_INPUT" ]; then
            echo "::error::versionName 为空，请填写本次发布的版本号（形如 1.5.18）"
            exit 1
          fi
          if ! printf '%s' "$VERSION_INPUT" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::versionName '${VERSION_INPUT}' 不是合法的 SemVer（必须为 X.Y.Z，无前导零）"
            exit 1
          fi
          if [ -n "$CODE_INPUT" ]; then
            VC="$CODE_INPUT"
            case "$VC" in
              ''|*[!0-9]*) echo "::error::versionCode '${CODE_INPUT}' 必须是纯数字"; exit 1 ;;
            esac
          else
            VC=$(( $(date +%s) / 60 ))
          fi
          TAG="${TAG_INPUT:-v${VERSION_INPUT}}"
          if [ "$TAG" != "v${VERSION_INPUT}" ]; then
            echo "::error::releaseTag '${TAG}' 必须等于 v${VERSION_INPUT}（SemVer 要求 tag 与版本号一一对应）"
            exit 1
          fi
          echo "versionName=${VERSION_INPUT}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${VC}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION_INPUT} / versionCode ${VC} / tag ${TAG}"

      - name: 门禁自测
        run: |
          set -e
          # 门禁是 CI 的裁判，它自己坏掉时没人会发现：历史审计曾经因为拿 .gradle.kts
          # 文本去 json.loads、异常被 except 吞掉，每次都报「通过」而实际一个提交都没扫。
          # 所以先用临时仓库复现历史违规，确认它真的能拦住，再拿它去裁判这次发布。
          python3 .scripts/version_gate_test.py

      - name: SemVer 版本门禁
        run: |
          set -e
          python3 .scripts/version_gate.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --android-gradle app/build.gradle.kts \
            --version-name "${{ steps.version.outputs.versionName }}" \
            --version-code "${{ steps.version.outputs.versionCode }}" \
            --check-commits \
            --mode strict

      - name: SemVer 历史审计
        run: |
          set -e
          # 揪出「版本号写进代码却从未打 tag」的欠账：版本序列出现空洞会让用户
          # 无法判断哪个版本对应哪次构建。本仓库当前无欠账。
          python3 .scripts/version_gate.py \
            --audit-history app/build.gradle.kts:POLARIS_VERSION_NAME

  # 门禁通过后由流水线自己打 tag：人工不再先打 tag，避免「tag 指向的提交」与
  # 「实际构建的提交」分叉。只创建 v* 标签；已存在且指向同一 commit 时幂等继续；
  # 指向别的 commit 直接失败 —— 绝不 force、不移动、不删除任何已有 tag。
  release-tag:
    needs: [release-precheck, version]
    if: inputs.dryRun != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ github.sha }}
    steps:
      - name: 创建或校验 tag（幂等，不 force）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          case "$TAG" in
            v*) ;;
            *) echo "::error::拒绝创建非 v* 标签：$TAG"; exit 1 ;;
          esac
          OUT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>&1)" && STATUS=0 || STATUS=$?
          # 这个端点对「ref 不存在」返回 422（body: No commit found for SHA: <ref>），
          # 只有别的失败路径才回 404：两种都当「尚不存在」，其余一律 fail-closed。
          # 422 必须同时带 No commit found 才算不存在（措辞/误匹配时不静默放宽）。
          # 2026-10-15 实测：/commits/v1.12.0 -> 422；/git/ref/tags/v1.12.0 -> 404。
          if [ "$STATUS" = "0" ]; then
            if [ "$OUT" != "$SHA" ]; then
              echo "::error::tag $TAG 已存在且指向 $OUT，本次构建的是 $SHA；拒绝移动/覆盖已有 tag"
              exit 1
            fi
            echo "::notice::tag $TAG 已存在且指向本次构建提交，幂等继续"
          elif printf '%s' "$OUT" | grep -q 'HTTP 404' \
            || { printf '%s' "$OUT" | grep -q 'HTTP 422' && printf '%s' "$OUT" | grep -q 'No commit found'; }; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
            echo "::notice::已创建 tag $TAG → $SHA"
          else
            echo "::error::读取 tag $TAG 失败（fail-closed，不打 tag）：$OUT"
            exit 1
          fi
          FINAL="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          if [ "$FINAL" != "$SHA" ]; then
            echo "::error::tag $TAG 读回指向 $FINAL，期望 $SHA"
            exit 1
          fi
          echo "::notice::tag $TAG 已确认指向 $SHA"

  build:
    needs: [version, release-tag]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.release-tag.result != 'failure' && needs.release-tag.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 版本三件套只解析一次（version job），这里原样取用。
      POLARIS_RELEASE_VERSION: ${{ needs.version.outputs.versionName }}
      POLARIS_RELEASE_CODE: ${{ needs.version.outputs.versionCode }}
      POLARIS_RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER" || { echo "::error::找不到 sdkmanager（ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT）"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          "$SDKMANAGER" "cmake;3.22.1" || echo "::warning::cmake 预装失败，交由 AGP 自动下载"
          ls "$ANDROID_SDK_ROOT/cmake" 2>/dev/null || echo "SDK 内暂无可用的 cmake"

      - name: 还原发布签名
        if: inputs.buildType == 'release'
        env:
          STORE_B64: ${{ secrets.POLARIS_RELEASE_STORE_B64 }}
        run: |
          test -n "$STORE_B64" || { echo "::error::缺少 Secret POLARIS_RELEASE_STORE_B64（release 构建必需，见网站签名面板）"; exit 1; }
          echo "$STORE_B64" | base64 -d > release.keystore

      - name: 应用自定义图标
        # 只有调用方显式传入 iconB64 时才覆盖仓库资源。
        # 曾经这里还带 `|| hashFiles('app/icon-source.png') != ''`，而仓库里长期躺着一张
        # 旧版图标的 icon-source.png，导致每次发版都被 ImageMagick 重新生成一遍、
        # 把 res/ 下的正式图标资源盖回旧图（还会造出与矢量前景同名的 nodpi 位图）。
        if: inputs.iconB64 != ''
        env:
          ICON_B64: ${{ inputs.iconB64 }}
        run: |
          set -e
          if [ -n "$ICON_B64" ]; then
            echo "$ICON_B64" | base64 -d > app/icon-source.png
          fi
          test -f app/icon-source.png || { echo "无图标源，跳过"; exit 0; }
          # 自定义前景生成的是 drawable-nodpi/ic_launcher_foreground.png，
          # 与仓库里的矢量 drawable/ic_launcher_foreground.xml 同名。同名资源按密度
          # 选取时 nodpi 会压过无密度限定的矢量，必须先清掉矢量，结果才唯一。
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi

          SS=4
          VISIBLE=288
          CANVAS=432
          RADIUS_PCT=22

          mask_squircle() {
            local s=$1 out=$2 r=$(( $1 * RADIUS_PCT * SS / 100 ))
            convert -size "$((s * SS))x$((s * SS))" xc:none -fill white \
              -draw "roundrectangle 0,0,$((s * SS - 1)),$((s * SS - 1)),${r},${r}" \
              -resize "${s}x${s}" "$out"
          }
          mask_circle() {
            local s=$1 out=$2 c=$((s * SS / 2))
            convert -size "$((s * SS))x$((s * SS))" xc:none -fill white \
              -draw "circle ${c},${c} ${c},1" -resize "${s}x${s}" "$out"
          }

          mkdir -p app/src/main/res/drawable-nodpi
          convert app/icon-source.png -resize "${VISIBLE}x${VISIBLE}^" -gravity center \
            -extent "${VISIBLE}x${VISIBLE}" /tmp/_fg.png
          mask_squircle "$VISIBLE" /tmp/_fg_mask.png
          convert /tmp/_fg.png /tmp/_fg_mask.png -alpha off -compose CopyOpacity -composite /tmp/_fg_cut.png
          convert -size "${CANVAS}x${CANVAS}" xc:none /tmp/_fg_cut.png \
            -geometry "+$(( (CANVAS - VISIBLE) / 2 ))+$(( (CANVAS - VISIBLE) / 2 ))" -composite \
            app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          for entry in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $entry
            density=$1
            size=$2
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert app/icon-source.png -resize "${size}x${size}^" -gravity center \
              -extent "${size}x${size}" "$dir/_base.png"
            mask_squircle "$size" "$dir/_mask_sq.png"
            mask_circle "$size" "$dir/_mask_round.png"
            convert "$dir/_base.png" "$dir/_mask_sq.png" -alpha off \
              -compose CopyOpacity -composite "$dir/ic_launcher.png"
            convert "$dir/_base.png" "$dir/_mask_round.png" -alpha off \
              -compose CopyOpacity -composite "$dir/ic_launcher_round.png"
            rm -f "$dir/_base.png" "$dir/_mask_sq.png" "$dir/_mask_round.png"
          done
          rm -f /tmp/_fg.png /tmp/_fg_mask.png /tmp/_fg_cut.png

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      # 单测 / ktlint / Android Lint / R8 存活校验不再在这里重复跑：ci.yml 的质量门禁
      # 已经跑过，而 release-precheck 要求那次结果必须是 success（见 release-precheck job）。
      # 这里只负责产出可发布的二进制。
      - name: 编译（:app:assemble${{ inputs.buildType }}）
        env:
          POLARIS_APP_NAME: ${{ inputs.appName }}
          POLARIS_APPLICATION_ID: ${{ inputs.applicationId }}
          POLARIS_API_BASE_URL: ${{ inputs.apiBaseUrl }}
          POLARIS_API_TYPE: ${{ inputs.apiType }}
          POLARIS_NOTIFICATION_TITLE: ${{ inputs.notificationTitle }}
          POLARIS_NOTIFICATION_TRAFFIC: ${{ inputs.notificationTraffic }}
          POLARIS_TELEGRAM_GROUP_URL: ${{ inputs.telegramGroupUrl }}

          # 应用内更新提示已随本版本移除：remote.json 不再承载「有新版本」的语义，
          # 发布流程只负责把历史遗留的 update_* 字段置空，不再写入版本号/直链/校验和。
          # 远程配置源与 GitHub 域名仍需进编译期白名单，否则 RemoteConfigParser
          # 会静默拒绝远端配置（SEC-2 教训）。
          POLARIS_REMOTE_CONFIG_URLS: ${{ inputs.remoteConfigUrls != '' && inputs.remoteConfigUrls || 'https://raw.githubusercontent.com/ipevel/polaris/main/config/remote.json' }}
          POLARIS_ALLOWED_DOMAINS: ${{ inputs.allowedDomains != '' && inputs.allowedDomains || 'github.com,raw.githubusercontent.com,objects.githubusercontent.com' }}

          POLARIS_VERSION_NAME: ${{ inputs.versionName }}
          POLARIS_VERSION_CODE: ${{ inputs.versionCode }}
          POLARIS_BUILD_TYPE: ${{ inputs.buildType }}

          POLARIS_USE_MIRROR: 'false'

          POLARIS_RELEASE_STORE_FILE: ${{ inputs.buildType == 'release' && 'release.keystore' || '' }}
          # 这些 Secret 原为 fork 残留的 SLTE_ 前缀，已随 Gradle 变量统一改名 POLARIS_。
          # ⚠️ 改名生效的前置条件：必须先在 GitHub Settings → Secrets and variables → Actions
          # 建好 POLARIS_RELEASE_STORE_PASSWORD / POLARIS_RELEASE_KEY_ALIAS /
          # POLARIS_RELEASE_KEY_PASSWORD 三个同名 Secret，否则 release 构建会因取不到值而失败。
          # 迁移顺序：新建 POLARIS_* → 用它成功发一次版（验证签名指纹一致）→ 再删除旧的 SLTE_*。
          POLARIS_RELEASE_STORE_PASSWORD: ${{ secrets.POLARIS_RELEASE_STORE_PASSWORD }}
          POLARIS_RELEASE_KEY_ALIAS: ${{ secrets.POLARIS_RELEASE_KEY_ALIAS }}
          POLARIS_RELEASE_KEY_PASSWORD: ${{ secrets.POLARIS_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          # 版本号与 versionCode 由「解析发布版本号」步骤统一算出（并已过门禁校验），
          # 这里只做转发，避免再出现一份内联的 VC 计算逻辑与发布标签分叉。
          export POLARIS_VERSION_NAME="$POLARIS_RELEASE_VERSION"
          export POLARIS_VERSION_CODE="$POLARIS_RELEASE_CODE"
          ./gradlew ":app:assemble$POLARIS_BUILD_TYPE"

      - name: 生成校验文件（SHA-256 + 签名证书指纹）
        if: inputs.buildType == 'release'
        run: |
          set -e
          APK="app/build/outputs/apk/release/Polaris-${{ inputs.versionName }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 APK：$APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          # GPL-3.0 要求分发二进制时随附许可文本；隐私政策与用户协议一并附上，用户无需进仓库即可查阅。
          for doc in LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md; do
            if [ -f "$doc" ]; then
              cp "$doc" dist/
            else
              echo "::error::缺少随发布分发的文档：$doc"
              exit 1
            fi
          done
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > dist/SIGNING.txt 2>&1 || true
          else
            keytool -list -v -keystore release.keystore \
              -alias "${{ secrets.POLARIS_RELEASE_KEY_ALIAS }}" \
              -storepass "${{ secrets.POLARIS_RELEASE_STORE_PASSWORD }}" > dist/SIGNING.txt 2>&1 || \
              echo "::warning::SIGNING.txt 生成失败（apksigner 与 keytool 回退均不可用）"
          fi
          echo "--- SHA256SUMS.txt ---"
          cat dist/SHA256SUMS.txt
          echo "--- 签名证书 ---"
          grep -iE "certificate (SHA-256|SHA-1) digest|Signer #1" dist/SIGNING.txt | head -10 || true

      - name: 上传失败报告（构建失败时）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Polaris-reports-${{ inputs.versionName }}
          path: |
            app/build/reports/**
          if-no-files-found: ignore

      - name: 上传产物
        if: inputs.dryRun != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Polaris-${{ inputs.versionName }}
          path: |
            app/build/outputs/apk/*/Polaris-*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING.txt
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.md
            dist/PRIVACY.md
            dist/TERMS.md
          if-no-files-found: error
          retention-days: 90

  # Windows 便携版：与安卓 APK 共用同一个 versionName / tag / Release。
  # 版本号只从 version job 取，不在这里重新解析，避免两个产物版本号分叉。
  windows:
    needs: [version, release-tag]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.release-tag.result != 'failure' && needs.release-tag.result != 'cancelled' }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      POLARIS_RELEASE_VERSION: ${{ needs.version.outputs.versionName }}
      # windows-latest 的 Python 3.12 默认 stdout 编码是 cp1252，
      # 打印中文会 UnicodeEncodeError: 'charmap' codec can't encode characters。
      # 显式开 UTF-8 模式（fetch-core.py / fetch-geo.py 会打印「core/ 内容：」）。
      PYTHONUTF8: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 便携版只需要 design/windows/app 与根级构建配置。checkout 没有「只取子目录」
          # 的选项，这里取全量（仓库 .git 约 290MB，可接受）。
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: design/windows/app/package-lock.json

      - name: 安装依赖
        working-directory: design/windows/app
        run: npm ci

      - name: 安装 Python 依赖
        run: python -m pip install requests

      - name: 拉取内核与 GeoIP 数据
        # windows-latest 的默认 shell 是 pwsh，`set -e` 会被解析成 Set-Variable -e 而报错；
        # 这几步要 POSIX 语法（set -e / # 注释 / 变量展开），显式指定 bash。
        shell: bash
        working-directory: design/windows/app
        run: |
          set -e
          # mihomo 内核、wintun 与 GeoIP 规则库都不入库（core.lock.json 锁版本），
          # 每次构建现拉，保证产物里的内核是确定版本。失败即失败，不静默跳过。
          python scripts/fetch-core.py
          python scripts/fetch-geo.py

      - name: 对齐版本号
        shell: bash
        working-directory: design/windows/app
        run: |
          set -e
          # 便携版文件名 Polaris-portable-<version>.zip 由 package.json 的 version 决定，
          # 必须与安卓 APK 的 versionName 逐字一致，否则同一个 Release 里两个产物版本号不同。
          npm version --no-git-tag-version "$POLARIS_RELEASE_VERSION"
          node -e "const p=require('./package.json');console.log('便携版版本号：'+p.version)"

      - name: 打包便携版
        working-directory: design/windows/app
        run: npm run dist

      - name: 上传产物
        if: inputs.dryRun != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Polaris-portable-${{ inputs.versionName }}
          path: design/windows/app/dist/Polaris-portable-*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [build, windows, release-tag]
    if: inputs.buildType == 'release' && inputs.publishRelease == 'true' && inputs.dryRun != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Polaris-${{ inputs.versionName }}
          path: incoming

      - name: 下载便携版产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Polaris-portable-${{ inputs.versionName }}
          path: incoming-win

      - name: 整理发布资产
        run: |
          set -e
          mkdir -p out
          find incoming -name 'Polaris-*.apk' -exec cp -v {} out/ \;
          for f in SHA256SUMS.txt SIGNING.txt LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md; do
            src=$(find incoming -name "$f" -print -quit)
            if [ -n "$src" ]; then cp "$src" out/; fi
          done
          ls -la out
          ls out/*.apk >/dev/null 2>&1 || { echo "::error::未从产物中取到 APK"; exit 1; }

          # 便携版 zip 与 APK 同属一个 Release，摘要必须一起进 SHA256SUMS.txt，
          # 否则用户校验便携版时无从核对。
          ZIP=$(find incoming-win -name 'Polaris-portable-*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "::error::未从产物中取到便携版 zip"
            exit 1
          fi
          cp -v "$ZIP" out/
          (cd out && sha256sum "$(basename "$ZIP")") >> out/SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat out/SHA256SUMS.txt

      - name: 组装 Release 说明
        env:
          VERSION: ${{ inputs.versionName }}
          NOTES: ${{ inputs.releaseNotes }}
        run: |
          set -e
          {
            echo "## Polaris ${VERSION}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 面板后端 | 登录时自动识别（XiaoV2b / Xboard） |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            if [ -n "$NOTES" ] && [ "$NOTES" != "auto" ]; then
              echo "### 变更说明"
              echo ""
              echo "$NOTES"
            elif [ "$NOTES" = "auto" ]; then
              echo "### 变更说明"
              echo ""
              echo '> 见 git log'
            fi
            echo ""
            echo "### Windows 便携版"
            echo ""
            echo "同一个 Release 里同时提供 Windows 便携版，与安卓 APK 共用版本号。"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`Polaris-portable-${VERSION}.zip\` |"
            echo "| 平台 | Windows 10/11 x64，解压即用（不写注册表、不落 %APPDATA%） |"
            echo ""
            echo "包内 mihomo 内核与 GeoIP 规则库在构建时按 \`core.lock.json\` 锁定的版本拉取。"
            echo ""
            echo "### 文件校验（SHA-256）"
            echo ""
            echo '```'
            cat out/SHA256SUMS.txt 2>/dev/null || echo "见附件 SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "### 签名证书指纹"
            echo ""
            echo '```'
            grep -iE "certificate (SHA-256|SHA-1) digest" out/SIGNING.txt 2>/dev/null \
              || echo "见附件 SIGNING.txt"
            echo '```'
            echo ""
            echo "> 安装前请核对上述 SHA-256，确认安装包未被篡改。"
            echo ""
            echo "> 请直接覆盖安装，不要先卸载，以保留你已有的配置与数据。"
            echo ""
            echo "### 许可"
            echo ""
            echo "本应用以 GPL-3.0 分发，附件中的 \`LICENSE\` 为许可正文，\`THIRD-PARTY-NOTICES.md\` 列出全部第三方组件与许可；\`PRIVACY.md\`、\`TERMS.md\` 分别为隐私政策与用户协议。源代码见 [本仓库](https://github.com/${GITHUB_REPOSITORY})。"
          } > notes.md
          cat notes.md

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.versionName }}
          TAG_INPUT: ${{ inputs.releaseTag }}
        run: |
          set -e
          TAG="${TAG_INPUT:-v${VERSION}}"
          echo "目标标签：$TAG"
          FRESH=1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，更新资产与说明"
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "Polaris $VERSION" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
            FRESH=0
          else
            # --target 必须给：gh 的默认目标是 main 分支，而 main 可能在这套
            # 流水线跑的几分钟里被别人推过。不给的话，产物编的是 GITHUB_SHA，
            # tag 却会落在发版那一刻的 main HEAD 上——两者静默地不一致，
            # 谁 checkout 那个 tag 编出来的东西都不等于你发出去的 APK。
            # tag 必须指向你验过的那份代码，这是「已发布版本不可改」最底下那条。
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Polaris $VERSION" \
              --notes-file notes.md \
              --latest
          fi
          # 发完再回头看一眼 tag 究竟指向谁，别只信命令行的意图。
          # 刚建的 tag 指向不对 = --target 没生效，那必须炸。
          # 已存在的 tag 指向不对 = 拿新构建覆盖了老 tag 的资产（重发是允许的，
          # 但这时发布页的 tag 与 APK 对不上号，值得喊一声而不是拦住发版）。
          TAGGED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$TAGGED_SHA" != "$GITHUB_SHA" ]; then
            if [ "$FRESH" = "1" ]; then
              echo "::error::tag $TAG 指向 $TAGGED_SHA，而本流水线构建的是 $GITHUB_SHA"
              exit 1
            fi
            echo "::warning::tag $TAG 指向 $TAGGED_SHA，本次资产构建自 $GITHUB_SHA（重发同一版本号）"
          else
            echo "::notice::tag $TAG 已确认指向构建提交 $TAGGED_SHA"
          fi
          echo "::notice::已发布 https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
