name: Polaris Build

# 打包并（可选）发布到 GitHub Releases。
#
# 用法：Actions → Polaris Build → Run workflow，填参数后运行。
#   - buildType=release 需要仓库 Secrets 四件套：
#       SLTE_RELEASE_STORE_B64 / POLARIS_RELEASE_STORE_PASSWORD
#       POLARIS_RELEASE_KEY_ALIAS / POLARIS_RELEASE_KEY_PASSWORD
#   - publishRelease=true 时，构建成功后自动创建/更新 Release 并附上 APK、
#     SHA256SUMS.txt 与签名证书指纹（SIGNING.txt）。
#   - 重复运行同一标签（releaseTag 相同）会更新既有 Release 的资产与说明，不会失败。
#   - versionName 必须填本次发布的版本号，且严格大于上一已发布版本：构建前会跑
#     .scripts/version_gate.py 校验版本号/versionCode/tag 三者自洽，并检查区间内的
#     feat / 破坏性变更是否递增了对应位（规则见 VERSIONING.md）。门禁不通过即中止，
#     可用 gateMode=warn 降级为告警、gateMode=off 跳过（仅限紧急回滚场景）。

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 应用名称（桌面显示名）
        required: true
        default: Polaris
      applicationId:
        description: 包名
        required: true
        default: com.polaris.app
      versionName:
        description: 版本号（X.Y.Z，必须严格大于上一已发布版本；门禁会校验）
        required: true
        default: ''
      versionCode:
        description: versionCode（留空自动生成）
        required: false
        default: ''
      apiBaseUrl:
        description: 面板 API 地址
        required: true
      apiType:
        description: 面板版本
        type: choice
        options:
          - xiaov2b
          - xboard
        default: xiaov2b
      remoteConfigUrls:
        description: 远程动态地址（逗号分隔，最多 3 个）
        required: false
        default: ''
      allowedDomains:
        description: 追加白名单域名（逗号分隔）
        required: false
        default: ''
      notificationTitle:
        description: 通知栏标题（留空跟随应用名）
        required: false
        default: ''
      notificationTraffic:
        description: 通知栏流量显示
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      telegramGroupUrl:
        description: Telegram 讨论组链接（留空则个人页不显示该入口）
        required: false
        default: ''
      buildType:
        description: 构建类型（release 需仓库 Secrets 签名四件套）
        type: choice
        options:
          - debug
          - release
        default: release
      publishRelease:
        description: 是否创建 GitHub Release（仅 buildType=release 时生效）
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      releaseTag:
        description: Release 标签名（留空自动使用 v<版本号>）
        required: false
        default: ''
      gateMode:
        description: |
          版本门禁模式。strict=不一致即中止（默认）；warn=只告警；off=跳过。
          门禁内容：版本号合法、tag 与版本号一致、版本号与 versionCode 相对上一版严格递增、
          区间内有 feat 却只升 PATCH 则拦截。规则见 VERSIONING.md。
        type: choice
        options:
          - strict
          - warn
          - off
        default: strict
      releaseNotes:
        description: |
          Release 变更说明（留空则不输出「变更说明」小节；填 auto 会写成「见 git log」）。
          注意：本仓库应用内更新功能已移除，变更说明**不得**描述更新/升级功能的增删，
          只写「修复若干已知问题」这类中性措辞；同理 commit 标题也不要写。
        required: false
        default: ''
      iconB64:
        description: 自定义启动图标（PNG 的 base64，≤36KB；留空使用仓库默认图标）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # 发布构建按分支串行：同分支重复触发时排队等待，不打断进行中的发布（避免产生半成品 Release）
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 版本门禁要读历史 tag 与上一版构建文件。本仓库 .git 约 290MB，
          # 不做全量克隆：先只取当前提交与 tag 引用，再按需加深（见下一步）。
          fetch-depth: 1
          fetch-tags: true

      - name: 补全版本门禁所需的历史
        run: |
          set -e
          # 门禁要跑 git log <上一版 tag>..HEAD 判定提交类型，depth=1 取不到区间提交。
          # 加深到 500 个提交即可覆盖全部 tag（当前仓库约 220 个提交），失败则退回全量。
          git fetch --no-tags --deepen=500 origin "$(git rev-parse --abbrev-ref HEAD)" \
            || git fetch --no-tags --unshallow
          echo "可见 tag 数：$(git tag --list 'v*' | wc -l)"

      - name: 解析发布版本号
        id: version
        env:
          VERSION_INPUT: ${{ inputs.versionName }}
          CODE_INPUT: ${{ inputs.versionCode }}
          TAG_INPUT: ${{ inputs.releaseTag }}
        run: |
          set -e
          # versionName / versionCode / tag 的单一来源：后续所有步骤都从 $GITHUB_ENV 读取，
          # 避免「构建用 A、发布挂 B」的分叉。
          if [ -z "$VERSION_INPUT" ]; then
            echo "::error::versionName 为空，请填写本次发布的版本号（形如 1.5.18）"
            exit 1
          fi
          if ! printf '%s' "$VERSION_INPUT" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::versionName '${VERSION_INPUT}' 不是合法的 SemVer（必须为 X.Y.Z，无前导零）"
            exit 1
          fi
          if [ -n "$CODE_INPUT" ]; then
            VC="$CODE_INPUT"
            case "$VC" in
              ''|*[!0-9]*) echo "::error::versionCode '${CODE_INPUT}' 必须是纯数字"; exit 1 ;;
            esac
          else
            VC=$(( $(date +%s) / 60 ))
          fi
          TAG="${TAG_INPUT:-v${VERSION_INPUT}}"
          if [ "$TAG" != "v${VERSION_INPUT}" ]; then
            echo "::error::releaseTag '${TAG}' 必须等于 v${VERSION_INPUT}（SemVer 要求 tag 与版本号一一对应）"
            exit 1
          fi
          {
            echo "POLARIS_RELEASE_VERSION=${VERSION_INPUT}"
            echo "POLARIS_RELEASE_CODE=${VC}"
            echo "POLARIS_RELEASE_TAG=${TAG}"
          } >> "$GITHUB_ENV"
          echo "版本 ${VERSION_INPUT} / versionCode ${VC} / tag ${TAG}"

      - name: 门禁自测
        run: |
          set -e
          # 门禁是 CI 的裁判，它自己坏掉时没人会发现：历史审计曾经因为拿 .gradle.kts
          # 文本去 json.loads、异常被 except 吞掉，每次都报「通过」而实际一个提交都没扫。
          # 所以先用临时仓库复现历史违规，确认它真的能拦住，再拿它去裁判这次发布。
          python3 .scripts/version_gate_test.py

      - name: SemVer 版本门禁
        if: inputs.gateMode != 'off'
        env:
          GATE_MODE: ${{ inputs.gateMode }}
        run: |
          set -e
          python3 .scripts/version_gate.py \
            --tag "$POLARIS_RELEASE_TAG" \
            --android-gradle app/build.gradle.kts \
            --version-name "$POLARIS_RELEASE_VERSION" \
            --version-code "$POLARIS_RELEASE_CODE" \
            --check-commits \
            --mode "$GATE_MODE"

      - name: SemVer 历史审计
        if: inputs.gateMode == 'strict'
        run: |
          set -e
          # 揪出「版本号写进代码却从未打 tag」的欠账：版本序列出现空洞会让用户
          # 无法判断哪个版本对应哪次构建。本仓库当前无欠账。
          python3 .scripts/version_gate.py \
            --audit-history app/build.gradle.kts:POLARIS_VERSION_NAME

      - name: 安装 JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER" || { echo "::error::找不到 sdkmanager（ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT）"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          "$SDKMANAGER" "cmake;3.22.1" || echo "::warning::cmake 预装失败，交由 AGP 自动下载"
          ls "$ANDROID_SDK_ROOT/cmake" 2>/dev/null || echo "SDK 内暂无可用的 cmake"

      - name: 还原发布签名
        if: inputs.buildType == 'release'
        env:
          STORE_B64: ${{ secrets.SLTE_RELEASE_STORE_B64 }}
        run: |
          test -n "$STORE_B64" || { echo "::error::缺少 Secret SLTE_RELEASE_STORE_B64（release 构建必需，见网站签名面板）"; exit 1; }
          echo "$STORE_B64" | base64 -d > release.keystore

      - name: 应用自定义图标
        # 只有调用方显式传入 iconB64 时才覆盖仓库资源。
        # 曾经这里还带 `|| hashFiles('app/icon-source.png') != ''`，而仓库里长期躺着一张
        # 旧版图标的 icon-source.png，导致每次发版都被 ImageMagick 重新生成一遍、
        # 把 res/ 下的正式图标资源盖回旧图（还会造出与矢量前景同名的 nodpi 位图）。
        if: inputs.iconB64 != ''
        env:
          ICON_B64: ${{ inputs.iconB64 }}
        run: |
          set -e
          if [ -n "$ICON_B64" ]; then
            echo "$ICON_B64" | base64 -d > app/icon-source.png
          fi
          test -f app/icon-source.png || { echo "无图标源，跳过"; exit 0; }
          # 自定义前景生成的是 drawable-nodpi/ic_launcher_foreground.png，
          # 与仓库里的矢量 drawable/ic_launcher_foreground.xml 同名。同名资源按密度
          # 选取时 nodpi 会压过无密度限定的矢量，必须先清掉矢量，结果才唯一。
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi

          SS=4
          VISIBLE=288
          CANVAS=432
          RADIUS_PCT=22

          mask_squircle() {
            local s=$1 out=$2 r=$(( $1 * RADIUS_PCT * SS / 100 ))
            convert -size "$((s * SS))x$((s * SS))" xc:none -fill white \
              -draw "roundrectangle 0,0,$((s * SS - 1)),$((s * SS - 1)),${r},${r}" \
              -resize "${s}x${s}" "$out"
          }
          mask_circle() {
            local s=$1 out=$2 c=$((s * SS / 2))
            convert -size "$((s * SS))x$((s * SS))" xc:none -fill white \
              -draw "circle ${c},${c} ${c},1" -resize "${s}x${s}" "$out"
          }

          mkdir -p app/src/main/res/drawable-nodpi
          convert app/icon-source.png -resize "${VISIBLE}x${VISIBLE}^" -gravity center \
            -extent "${VISIBLE}x${VISIBLE}" /tmp/_fg.png
          mask_squircle "$VISIBLE" /tmp/_fg_mask.png
          convert /tmp/_fg.png /tmp/_fg_mask.png -alpha off -compose CopyOpacity -composite /tmp/_fg_cut.png
          convert -size "${CANVAS}x${CANVAS}" xc:none /tmp/_fg_cut.png \
            -geometry "+$(( (CANVAS - VISIBLE) / 2 ))+$(( (CANVAS - VISIBLE) / 2 ))" -composite \
            app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          for entry in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $entry
            density=$1
            size=$2
            dir="app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert app/icon-source.png -resize "${size}x${size}^" -gravity center \
              -extent "${size}x${size}" "$dir/_base.png"
            mask_squircle "$size" "$dir/_mask_sq.png"
            mask_circle "$size" "$dir/_mask_round.png"
            convert "$dir/_base.png" "$dir/_mask_sq.png" -alpha off \
              -compose CopyOpacity -composite "$dir/ic_launcher.png"
            convert "$dir/_base.png" "$dir/_mask_round.png" -alpha off \
              -compose CopyOpacity -composite "$dir/ic_launcher_round.png"
            rm -f "$dir/_base.png" "$dir/_mask_sq.png" "$dir/_mask_round.png"
          done
          rm -f /tmp/_fg.png /tmp/_fg_mask.png /tmp/_fg_cut.png

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      - name: 单元测试 + 编译
        env:
          POLARIS_APP_NAME: ${{ inputs.appName }}
          POLARIS_APPLICATION_ID: ${{ inputs.applicationId }}
          POLARIS_API_BASE_URL: ${{ inputs.apiBaseUrl }}
          POLARIS_API_TYPE: ${{ inputs.apiType }}
          POLARIS_NOTIFICATION_TITLE: ${{ inputs.notificationTitle }}
          POLARIS_NOTIFICATION_TRAFFIC: ${{ inputs.notificationTraffic }}
          POLARIS_TELEGRAM_GROUP_URL: ${{ inputs.telegramGroupUrl }}

          # 应用内更新提示已随本版本移除：remote.json 不再承载「有新版本」的语义，
          # 发布流程只负责把历史遗留的 update_* 字段置空，不再写入版本号/直链/校验和。
          # 远程配置源与 GitHub 域名仍需进编译期白名单，否则 RemoteConfigParser
          # 会静默拒绝远端配置（SEC-2 教训）。
          POLARIS_REMOTE_CONFIG_URLS: ${{ inputs.remoteConfigUrls != '' && inputs.remoteConfigUrls || 'https://raw.githubusercontent.com/ipevel/polaris/main/config/remote.json' }}
          POLARIS_ALLOWED_DOMAINS: ${{ inputs.allowedDomains != '' && inputs.allowedDomains || 'github.com,raw.githubusercontent.com,objects.githubusercontent.com' }}

          POLARIS_VERSION_NAME: ${{ inputs.versionName }}
          POLARIS_VERSION_CODE: ${{ inputs.versionCode }}
          POLARIS_BUILD_TYPE: ${{ inputs.buildType }}

          POLARIS_USE_MIRROR: 'false'

          POLARIS_RELEASE_STORE_FILE: ${{ inputs.buildType == 'release' && 'release.keystore' || '' }}
          # 注意：GitHub Secrets 值不可读复制，secret 名保留 SLTE_ 前缀（与仓库实际配置一致），
          # 仅 env 变量名使用 POLARIS_ 前缀传入 Gradle。
          POLARIS_RELEASE_STORE_PASSWORD: ${{ secrets.SLTE_RELEASE_STORE_PASSWORD }}
          POLARIS_RELEASE_KEY_ALIAS: ${{ secrets.SLTE_RELEASE_KEY_ALIAS }}
          POLARIS_RELEASE_KEY_PASSWORD: ${{ secrets.SLTE_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          # 版本号与 versionCode 由「解析发布版本号」步骤统一算出（并已过门禁校验），
          # 这里只做转发，避免再出现一份内联的 VC 计算逻辑与发布标签分叉。
          export POLARIS_VERSION_NAME="$POLARIS_RELEASE_VERSION"
          export POLARIS_VERSION_CODE="$POLARIS_RELEASE_CODE"
          ./gradlew :app:testDebugUnitTest ":app:assemble$POLARIS_BUILD_TYPE"

      - name: 代码风格与静态检查（ktlint + Android Lint + R8 存活校验）
        env:
          POLARIS_USE_MIRROR: 'false'
          POLARIS_RELEASE_STORE_FILE: ${{ runner.temp }}/build-throwaway.keystore
          POLARIS_RELEASE_STORE_PASSWORD: build-throwaway
          POLARIS_RELEASE_KEY_ALIAS: build-throwaway
          POLARIS_RELEASE_KEY_PASSWORD: build-throwaway
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$POLARIS_RELEASE_STORE_FILE" \
            -alias build-throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -storepass build-throwaway -keypass build-throwaway \
            -dname "CN=CI-Throwaway, OU=CI, O=CI, C=CN"
          ./gradlew :app:ktlintCheck :app:lintDebug

          ./gradlew :app:verifyReleaseApiSurvivors

          if rg -n 'Icons\.(AutoMirrored\.)?(Outlined|Rounded|Filled|Sharp|TwoTone)\.' \
               app/src/main/java --glob '!**/ui/theme/SlteIcons.kt' --glob '!**/ui/v5/**'; then
            echo "::error::页面出现裸 Icons.* 引用，请改为 SlteIcons.*（SlteIcons 统一图标规范；ui/v5 设计系统目录除外，其图标为组件自身定义）"
            exit 1
          fi

      - name: 生成校验文件（SHA-256 + 签名证书指纹）
        if: inputs.buildType == 'release'
        run: |
          set -e
          APK="app/build/outputs/apk/release/Polaris-${{ inputs.versionName }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 APK：$APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          # GPL-3.0 要求分发二进制时随附许可文本；隐私政策与用户协议一并附上，用户无需进仓库即可查阅。
          for doc in LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md; do
            if [ -f "$doc" ]; then
              cp "$doc" dist/
            else
              echo "::error::缺少随发布分发的文档：$doc"
              exit 1
            fi
          done
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > dist/SIGNING.txt 2>&1 || true
          else
            keytool -list -v -keystore release.keystore \
              -alias "${{ secrets.SLTE_RELEASE_KEY_ALIAS }}" \
              -storepass "${{ secrets.SLTE_RELEASE_STORE_PASSWORD }}" > dist/SIGNING.txt 2>&1 || \
              echo "::warning::SIGNING.txt 生成失败（apksigner 与 keytool 回退均不可用）"
          fi
          echo "--- SHA256SUMS.txt ---"
          cat dist/SHA256SUMS.txt
          echo "--- 签名证书 ---"
          grep -iE "certificate (SHA-256|SHA-1) digest|Signer #1" dist/SIGNING.txt | head -10 || true

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Polaris-reports-${{ inputs.versionName }}
          path: |
            app/build/reports/ktlint/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: 上传产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Polaris-${{ inputs.versionName }}
          path: |
            app/build/outputs/apk/*/Polaris-*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING.txt
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.md
            dist/PRIVACY.md
            dist/TERMS.md
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: inputs.buildType == 'release' && inputs.publishRelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Polaris-${{ inputs.versionName }}
          path: incoming

      - name: 整理发布资产
        run: |
          set -e
          mkdir -p out
          find incoming -name 'Polaris-*.apk' -exec cp -v {} out/ \;
          for f in SHA256SUMS.txt SIGNING.txt LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md TERMS.md; do
            src=$(find incoming -name "$f" -print -quit)
            if [ -n "$src" ]; then cp "$src" out/; fi
          done
          ls -la out
          ls out/*.apk >/dev/null 2>&1 || { echo "::error::未从产物中取到 APK"; exit 1; }

      - name: 组装 Release 说明
        env:
          VERSION: ${{ inputs.versionName }}
          API_TYPE: ${{ inputs.apiType }}
          NOTES: ${{ inputs.releaseNotes }}
        run: |
          set -e
          {
            echo "## Polaris ${VERSION}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 后端类型 | \`${API_TYPE}\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            if [ -n "$NOTES" ] && [ "$NOTES" != "auto" ]; then
              echo "### 变更说明"
              echo ""
              echo "$NOTES"
            elif [ "$NOTES" = "auto" ]; then
              echo "### 变更说明"
              echo ""
              echo '> 见 git log'
            fi
            echo ""
            echo "### 文件校验（SHA-256）"
            echo ""
            echo '```'
            cat out/SHA256SUMS.txt 2>/dev/null || echo "见附件 SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "### 签名证书指纹"
            echo ""
            echo '```'
            grep -iE "certificate (SHA-256|SHA-1) digest" out/SIGNING.txt 2>/dev/null \
              || echo "见附件 SIGNING.txt"
            echo '```'
            echo ""
            echo "> 安装前请核对上述 SHA-256，确认安装包未被篡改。"
            echo ""
            echo "> 请直接覆盖安装，不要先卸载，以保留你已有的配置与数据。"
            echo ""
            echo "### 许可"
            echo ""
            echo "本应用以 GPL-3.0 分发，附件中的 \`LICENSE\` 为许可正文，\`THIRD-PARTY-NOTICES.md\` 列出全部第三方组件与许可；\`PRIVACY.md\`、\`TERMS.md\` 分别为隐私政策与用户协议。源代码见 [本仓库](https://github.com/${GITHUB_REPOSITORY})。"
          } > notes.md
          cat notes.md

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.versionName }}
          TAG_INPUT: ${{ inputs.releaseTag }}
        run: |
          set -e
          TAG="${TAG_INPUT:-v${VERSION}}"
          echo "目标标签：$TAG"
          FRESH=1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，更新资产与说明"
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "Polaris $VERSION" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
            FRESH=0
          else
            # --target 必须给：gh 的默认目标是 main 分支，而 main 可能在这套
            # 流水线跑的几分钟里被别人推过。不给的话，产物编的是 GITHUB_SHA，
            # tag 却会落在发版那一刻的 main HEAD 上——两者静默地不一致，
            # 谁 checkout 那个 tag 编出来的东西都不等于你发出去的 APK。
            # tag 必须指向你验过的那份代码，这是「已发布版本不可改」最底下那条。
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Polaris $VERSION" \
              --notes-file notes.md \
              --latest
          fi
          # 发完再回头看一眼 tag 究竟指向谁，别只信命令行的意图。
          # 刚建的 tag 指向不对 = --target 没生效，那必须炸。
          # 已存在的 tag 指向不对 = 拿新构建覆盖了老 tag 的资产（重发是允许的，
          # 但这时发布页的 tag 与 APK 对不上号，值得喊一声而不是拦住发版）。
          TAGGED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$TAGGED_SHA" != "$GITHUB_SHA" ]; then
            if [ "$FRESH" = "1" ]; then
              echo "::error::tag $TAG 指向 $TAGGED_SHA，而本流水线构建的是 $GITHUB_SHA"
              exit 1
            fi
            echo "::warning::tag $TAG 指向 $TAGGED_SHA，本次资产构建自 $GITHUB_SHA（重发同一版本号）"
          else
            echo "::notice::tag $TAG 已确认指向构建提交 $TAGGED_SHA"
          fi
          echo "::notice::已发布 https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: 停用 config/remote.json 的更新字段（应用内更新已移除）
        env:
          VERSION: ${{ inputs.versionName }}
          NOTES: ${{ inputs.releaseNotes }}
          TAG_INPUT: ${{ inputs.releaseTag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${TAG_INPUT:-v${VERSION}}"
          # releaseTag 是自由文本输入，限定 tag 合法字符后再拼进 gh 命令（防注入 / 防畸形标签）
          if [ -n "$TAG_INPUT" ] && ! printf '%s' "$TAG_INPUT" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::releaseTag 含非法字符（仅允许字母、数字、. _ - /）"
            exit 1
          fi

          # 顺序不变量：只有在 Release 资产真实存在之后，才允许把新版本号写进 remote.json。
          # 否则 App 会先刷到「有新版本」却下载不到包（或下载到上一版的包）。
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')" || { echo "::error::Release $TAG 不存在，中止 remote.json 更新"; exit 1; }
          printf '%s\n' "$ASSETS" | grep -qx "Polaris-${VERSION}.apk" || { echo "::error::Release $TAG 缺少资产 Polaris-${VERSION}.apk，中止 remote.json 更新"; exit 1; }

          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" polaris-updater
          cd polaris-updater
          # 直链跟随实际 Release 标签 $TAG（默认 v${VERSION}）：修复自定义 releaseTag
          # 时 remote.json 直链指向 v${VERSION} 而资产挂在自定义 tag 上的 404 陷阱
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Polaris-${VERSION}.apk"
          # 必须显式 export：Python 子进程经 os.environ 读取，未导出时 update_apk_url 恒为空串
          export APK_URL
          # 从构建产物校验文件中提取 APK SHA-256，写入 remote.json，供 App 端做「版本号/直链/校验和
          # 三者同源」的自洽性判定（UpdateViewModel 读取 update_apk_sha256），确认对应 Release 已真实发布；
          # 用户也可在 Release 页据 SHA-256 核对下载包。
          APK_SHA="$(awk '{print tolower($1)}' ../out/SHA256SUMS.txt | head -1)"
          # 取不到合法校验和就失败，绝不发布空值：空校验和会让 App 端无从验证下载包
          # （App 侧已拒绝安装无校验和的包，更应在发布侧断开）
          if ! printf '%s' "$APK_SHA" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::未取到合法的 APK SHA-256（实际值：'${APK_SHA}'），中止 remote.json 更新"
            exit 1
          fi
          export APK_SHA
          python3 -c "
          import json, os
          version = os.environ['VERSION']
          # 应用内更新功能已整体移除：不再向 remote.json 写入任何更新字段。
          # 保留这些键并置空，是为了让仍在读该文件的历史版本 App 解析到空版本号后不再提示更新，
          # 同时避免新旧 schema 分叉（RemoteConfigData 为整份序列化缓存）。
          with open('config/remote.json', 'r') as f:
              cfg = json.load(f)
          cfg['update_version'] = ''
          cfg['update_changelog_title'] = ''
          cfg['update_changelog'] = ''
          cfg['update_force'] = False
          cfg['update_apk_url'] = ''
          cfg['update_apk_sha256'] = ''
          with open('config/remote.json', 'w') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print('remote.json 已停用更新字段 (version=%s)' % version)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/remote.json
          if git diff --cached --quiet; then
            echo "无变更，跳过 push"
          else
            git commit -m "chore: 自动更新 remote.json → ${VERSION}"
            git push
            echo "已推送 remote.json 更新"
          fi
