name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GitHub runner 在海外，阿里云镜像会拖慢甚至阻断插件解析
      SLTE_USE_MIRROR: "false"
      # 截图基线由 macOS 渲染生成，Linux runner 不校验
      CI_SKIP_SCREENSHOT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify prebuilt native binaries
        run: ./gradlew :kernel-core:verifyNativeLibraries --no-daemon

      - name: Lint and unit tests
        run: >
          ./gradlew
          :app:ktlintCheck
          :kernel-common:ktlintCheck
          :kernel-service:ktlintCheck
          :kernel-core:ktlintCheck
          :app:testDebugUnitTest
          --no-daemon
