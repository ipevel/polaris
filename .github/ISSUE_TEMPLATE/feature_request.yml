name: Feature request / 功能建议
description: 提出新功能或改进建议 / Suggest an idea for this project
title: "[Feat] <android|win|repo|rules> "
labels: ["enhancement", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        标题格式 / Title format：[Feat] &lt;android|win|repo|rules&gt; 一句话
        Issue 只做登记与追踪；实现走 PR（PR body 首行写 Closes #N 或 Refs #N）。

  - type: textarea
    id: symptom
    attributes:
      label: 现状与期望 / Current state and expectation
      description: 现在是什么样、你希望变成什么样 / What it is like now, and what you want
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 影响面：平台 / Impact - platform
      options:
        - android
        - win
        - repo
        - rules
        - 多个 / Multiple
    validations:
      required: true

  - type: input
    id: path
    attributes:
      label: 影响面：路径或页面 / Impact - path or screen
      description: 例如 app/src/main/java/...、design/windows/app/...、设置 → 分流规则
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 复现或证据 / Repro or evidence
      description: 现状截图、现有行为的复现步骤，或同类实现的参考
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准 / Acceptance criteria
      description: 做到什么程度算这个需求完成
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 来源 / Source
      options:
        - 用户反馈 / User report
        - 内部发现 / Internal
        - 上游或第三方 / Upstream or third party
        - 其他 / Other
    validations:
      required: true
