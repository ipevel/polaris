version: 2
# 依赖与 Action 升级：默认暂停自动提 PR。
#
# 原因：本项目的 compileSdk 36 / AGP 8.9.1 与新版 androidx 存在硬约束——例如
# androidx.hilt:hilt-navigation-compose 1.4.0 要求 compileSdk ≥ 37 且 AGP ≥ 9.1，
# 自动升级会直接让构建失败（checkDebugAarMetadata 报 14 处不兼容）。
#
# 需要升级依赖时：把下面的 open-pull-requests-limit 改为非 0（或加 allow: update-types
# 只允许补丁级更新），先升级 compileSdk / AGP，再让 Dependabot 提 PR、由 CI 验证。
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      # Compose 全家桶必须同批升级（BOM 与各 artifact 版本相互约束）
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      net:
        patterns:
          - "com.squareup.*"
          - "com.squareup.okhttp3*"
          - "com.squareup.retrofit2*"
    ignore:
      # 与 Kotlin/compileSdk 存在硬约束的条目：升级需人工联动，禁止自动提 PR
      # （见 gradle/libs.versions.toml 中的版本注释）
      - dependency-name: "com.mikepenz:multiplatform-markdown-renderer*"
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - ci
